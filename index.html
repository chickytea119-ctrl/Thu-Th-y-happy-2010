<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20-10 Celebration 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #01040a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            position: relative;
        }

        /* Lớp nền sau cùng: Hình nét line 1 nam và 1 nữ chạy đến ôm nhau */
        .bg-line-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .line-scene {
            width: 380px;
            height: 380px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.45;
        }

        .line-person {
            position: absolute;
            bottom: 90px;
            fill: none;
            stroke: #00d2ff;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .line-boy {
            left: 50px;
            animation: runBoyLine 6s ease-in-out infinite;
        }

        .line-girl {
            right: 50px;
            animation: runGirlLine 6s ease-in-out infinite;
        }

        .line-heart {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            fill: none;
            stroke: #ff66b2;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: heartPopLine 6s ease-in-out infinite;
        }

        @keyframes runBoyLine {
            0% { transform: translateX(-90px); opacity: 0; }
            15% { opacity: 1; }
            45%, 70% { transform: translateX(35px); }
            85% { transform: translateX(-30px); opacity: 0.5; }
            100% { transform: translateX(-90px); opacity: 0; }
        }

        @keyframes runGirlLine {
            0% { transform: translateX(90px); opacity: 0; }
            15% { opacity: 1; }
            45%, 70% { transform: translateX(-35px); }
            85% { transform: translateX(30px); opacity: 0.5; }
            100% { transform: translateX(90px); opacity: 0; }
        }

        @keyframes heartPopLine {
            0%, 40% { transform: translateX(-50%) scale(0); opacity: 0; }
            45%, 72% { transform: translateX(-50%) scale(1.4); opacity: 1; }
            82%, 100% { transform: translateX(-50%) scale(0); opacity: 0; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content-box {
            position: absolute;
            bottom: 30px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            padding: 15px 20px;
            background: rgba(2, 12, 27, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(0, 191, 255, 0.25);
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.2);
        }

        h1 {
            color: #00d2ff;
            font-size: 1.2rem;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
            letter-spacing: 1px;
            font-weight: 600;
        }

        p {
            color: #d1f2ff;
            font-size: 0.85rem;
            line-height: 1.5;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="bg-line-container">
        <div class="line-scene">
            <svg class="line-heart" width="36" height="36" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <svg class="line-person line-boy" width="70" height="110" viewBox="0 0 24 24">
                <circle cx="12" cy="4" r="2.5"/>
                <path d="M12 7v7l-3 6M12 11l4 5"/>
                <path d="M9 9l3 2 3-2"/>
            </svg>
            <svg class="line-person line-girl" width="70" height="110" viewBox="0 0 24 24">
                <circle cx="12" cy="4" r="2.5"/>
                <path d="M12 7v5l-2.5 8M12 12l2.5 8"/>
                <path d="M8 10l4-1 4 1"/>
                <path d="M9.5 14h5"/>
            </svg>
        </div>
    </div>

    <canvas id="heartCanvas"></canvas>

    <div class="content-box">
        <h1>20-10</h1>
        <p>Chúc em bờ vai vững chãi, trái tim dịu dàng, ngày tháng bình yên 💙</p>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            perspective = Math.min(width, height) * 0.95;
            initParticles();
        });

        let particles = [];
        let fireworks = [];
        const particleCount = 15000;
        let perspective = Math.min(width, height) * 0.95;

        // Bất đẳng thức toán học thể tích 3D của trái tim chuẩn xác
        function isInHeart(x, y, z) {
            let ny = -y;
            let val = Math.pow(x*x + 2.25*z*z + ny*ny - 1, 3) - x*x * Math.pow(ny, 3) - 0.1125 * z*z * Math.pow(ny, 3);
            return val <= 0;
        }

        function initParticles() {
            particles = [];
            let count = 0;
            let scale = Math.min(width, height) * 0.25;

            while (count < particleCount) {
                let x = (Math.random() * 3 - 1.5);
                let y = (Math.random() * 3 - 1.5);
                let z = (Math.random() * 1.8 - 0.9);

                if (isInHeart(x, y, z)) {
                    let hue = Math.random() * 50 + 180; // Dải màu từ Cyan lam ngọc đến tím xanh
                    let lightness = Math.random() * 35 + 50;

                    particles.push({
                        x: x * scale,
                        y: y * scale,
                        z: z * scale,
                        size: Math.random() * 0.35 + 0.15,
                        color: `hsl(${hue}, 100%, ${lightness}%)`,
                        hue: hue
                    });
                    count++;
                }
            }
        }

        initParticles();

        // Tạo hiệu ứng bung tỏa pháo hoa 360 độ phủ kín toàn màn hình
        function createFireworksBurst(centerX, centerY) {
            const burstCount = 280; // Tăng số lượng hạt bung tỏa
            const maxDiagonal = Math.sqrt(width * width + height * height);

            for (let i = 0; i < burstCount; i++) {
                // Tỏa ra 360 độ ngẫu nhiên
                let angle = Math.random() * Math.PI * 2;
                // Vận tốc đa dạng giúp hạt phủ từ trung tâm ra tận góc viền màn hình
                let speed = Math.random() * (maxDiagonal / 70) + 3.0;

                let hueChoice = Math.random();
                // Phối màu Cyan lam ngọc, hồng pastel & tím sáng phát quang
                let hue = hueChoice < 0.5 ? (Math.random() * 30 + 180) : (Math.random() * 40 + 310);
                let lightness = Math.random() * 30 + 65;

                fireworks.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 1.8 + 0.6, // Hạt siêu mịn
                    color: `hsl(${hue}, 100%, ${lightness}%)`,
                    alpha: 1.0,
                    decay: Math.random() * 0.012 + 0.008, // Mờ dần mịn màng
                    drag: 0.985
                });
            }
        }

        let time = 0;
        let lastBeatState = false;

        function animate() {
            // Xóa nền mờ nhẹ tạo vệt sáng đuôi sao (trail)
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(1, 4, 10, 0.22)';
            ctx.fillRect(0, 0, width, height);

            time += 0.018;

            // Xoay 3D đung đưa nhẹ quanh trục Y
            let angleY = Math.sin(time * 0.6) * 0.38;
            let cosY = Math.cos(angleY);
            let sinY = Math.sin(angleY);

            // Nhịp đập trái tim sống động & êm mượt
            let beatFactor = Math.pow(Math.max(0, Math.sin(time * 2.0)), 4);
            let heartbeat = 1 + (beatFactor * 0.08 + Math.sin(time * 2.0 + 0.2) * 0.015);

            let centerX = width / 2;
            let centerY = height / 2 - 35;

            // Kích hoạt pháo hoa bùng tỏa full màn hình tại đỉnh điểm nhịp đập
            if (beatFactor > 0.85 && !lastBeatState) {
                createFireworksBurst(centerX, centerY);
                lastBeatState = true;
            } else if (beatFactor < 0.3) {
                lastBeatState = false;
            }

            let projected = [];

            // Biến đổi tọa độ 3D trái tim
            for (let p of particles) {
                let px = p.x * heartbeat;
                let py = p.y * heartbeat;
                let pz = p.z * heartbeat;

                // Xoay 3D quanh trục Y
                let rx = px * cosY + pz * sinY;
                let ry = py;
                let rz = -px * sinY + pz * cosY;

                let fov = perspective;
                let scale3D = fov / (fov + rz);
                let screenX = rx * scale3D + centerX;
                let screenY = ry * scale3D + centerY;

                projected.push({
                    x: screenX,
                    y: screenY,
                    size: Math.max(0.1, p.size * scale3D),
                    color: p.color,
                    z: rz
                });
            }

            // Sắp xếp Z-Buffer cho độ sâu 3D chuẩn
            projected.sort((a, b) => b.z - a.z);

            // Bật hiệu ứng phát sáng Neon Bloom (Additive Blending)
            ctx.globalCompositeOperation = 'lighter';

            // 1. Vẽ khối trái tim 3D hạt lấp lánh
            for (let p of projected) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }

            // 2. Cập nhật và vẽ hạt pháo hoa bùng tỏa full màn hình
            for (let i = fireworks.length - 1; i >= 0; i--) {
                let fw = fireworks[i];
                fw.x += fw.vx;
                fw.y += fw.vy;
                fw.vx *= fw.drag;
                fw.vy *= fw.drag;
                fw.alpha -= fw.decay;

                if (fw.alpha <= 0) {
                    fireworks.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, fw.alpha);
                ctx.beginPath();
                ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
                ctx.fillStyle = fw.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = fw.color;
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
